<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类标签管理 - NanoBlog后台管理</title>
    <link rel="stylesheet" href="/static/lib/layui/css/layui.css">
    <link rel="stylesheet" href="/static/css/admin/category.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
    <!--头部-->
    <div class="layui-header">
        <div class="layui-logo">📝 NanoBlog 后台管理</div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item"><a href="javascript:;" id="adminName">👤 管理员</a></li>
            <li class="layui-nav-item"><a href="javascript:;" id="logout">🚪 退出</a></li>
        </ul>
    </div>

    <!--左侧导航-->
    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="test">
                <li class="layui-nav-item"><a href="dashboard.html">📊 仪表盘</a></li>
                <li class="layui-nav-item"><a href="user.html">👥 用户管理</a></li>
                <li class="layui-nav-item"><a href="post.html">📄 文章管理</a></li>
                <li class="layui-nav-item"><a href="comment.html">💬 评论管理</a></li>
                <li class="layui-nav-item layui-this"><a href="category.html">🏷️ 分类标签管理</a></li>
            </ul>
        </div>
    </div>

    <!--内容主体区域-->
    <div class="layui-body">
        <!--页面标题-->
        <div class="page-header">
            <h1>分类标签管理</h1>
        </div>

        <div class="layui-tab layui-tab-brief" lay-filter="mainTab">
            <ul class="layui-tab-title">
                <li class="layui-this">📁 分类管理</li>
                <li>🏷️ 标签管理</li>
            </ul>
            <div class="layui-tab-content">
                <!--分类管理-->
                <div class="layui-tab-item layui-show">
                    <div class="tab-content">
                        <div class="toolbar-btns">
                            <button class="layui-btn" id="addCategoryBtn">新增分类</button>
                            <button class="layui-btn layui-btn-normal" id="expandAllBtn">展开全部</button>
                            <button class="layui-btn layui-btn-warm" id="collapseAllBtn">折叠全部</button>
                        </div>
                        <table class="layui-table" id="categoryTable" lay-size="sm">
                            <thead>
                                <tr>
                                    <th width="100">排序</th>
                                    <th width="80">ID</th>
                                    <th>分类名称</th>
                                    <th width="200">Slug</th>
                                    <th width="100">状态</th>
                                    <th width="180">操作</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!--标签管理-->
                <div class="layui-tab-item">
                    <div class="tab-content">
                        <div class="toolbar-btns">
                            <button class="layui-btn" id="addTagBtn">新增标签</button>
                        </div>
                        <table class="layui-hide" id="tagTable" lay-filter="tagTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--底部-->
    <div class="layui-footer">© 2026 NanoBlog - 后台管理系统</div>
</div>

<!--标签操作列模板-->
<script type="text/html" id="tagActionTpl">
    <a class="layui-btn layui-btn-danger layui-btn-xs action-btn" lay-event="delete">删除</a>
</script>

<script src="/static/lib/layui/layui.js"></script>
<script src="/static/js/admin/category.js"></script>
</body>
</html>
