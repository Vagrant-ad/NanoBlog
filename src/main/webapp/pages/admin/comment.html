<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论管理 - NanoBlog后台管理</title>
    <link rel="stylesheet" href="/static/lib/layui/css/layui.css">
    <link rel="stylesheet" href="/static/css/admin/comment.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
    <!-- 头部 -->
    <div class="layui-header">
        <div class="layui-logo">📝 NanoBlog 后台管理</div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item"><a href="javascript:;" id="adminName">👤 管理员</a></li>
            <li class="layui-nav-item"><a href="javascript:;" id="logout">🚪 退出</a></li>
        </ul>
    </div>

    <!-- 左侧导航 -->
    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="test">
                <li class="layui-nav-item"><a href="dashboard.html">📊 仪表盘</a></li>
                <li class="layui-nav-item"><a href="user.html">👥 用户管理</a></li>
                <li class="layui-nav-item"><a href="post.html">📄 文章管理</a></li>
                <li class="layui-nav-item layui-this"><a href="comment.html">💬 评论管理</a></li>
                <li class="layui-nav-item"><a href="category.html">🏷️ 分类标签管理</a></li>
            </ul>
        </div>
    </div>

    <!-- 内容主体区域 -->
    <div class="layui-body">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1>评论管理</h1>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <form class="layui-form" lay-filter="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline" style="flex: 1;">
                        <input type="text" name="articleId" placeholder="🔍 输入文章ID筛选评论" class="layui-input" autocomplete="off">
                    </div>
                    <button type="button" class="layui-btn" id="searchBtn">🔎 搜索</button>
                    <button type="reset" class="layui-btn layui-btn-primary">🔄 重置</button>
                </div>
            </form>
        </div>

        <!-- 表格区域 -->
        <div class="table-container">
            <table class="layui-hide" id="commentTable" lay-filter="commentTable"></table>
        </div>
    </div>

    <!-- 底部 -->
    <div class="layui-footer">© 2026 NanoBlog - 后台管理系统 | Made with ❤️</div>
</div>

<!-- 操作列模板 -->
<script type="text/html" id="actionTpl">
    <a class="layui-btn layui-btn-danger layui-btn-xs action-btn" lay-event="delete">🗑️ 删除</a>
</script>

<!-- 评论内容详情模板 -->
<script type="text/html" id="contentTpl">
    <div class="comment-content" title="{{ d.commentContent }}" lay-event="viewContent">{{ d.commentContent }}</div>
</script>

<!-- 文章标题模板 -->
<script type="text/html" id="articleTpl">
    <span class="article-title" title="{{ d.articleTitle }}">{{ d.articleTitle }}</span>
</script>

<script src="/static/lib/layui/layui.js"></script>
<script src="/static/js/admin/comment.js"></script>
</body>
</html>
