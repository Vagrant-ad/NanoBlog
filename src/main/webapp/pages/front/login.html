<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - NanoBlog</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* 1. 让整个页面居中 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            height: 100vh;           /* 占据整个浏览器高度 */
            background-color: #f4f7f6;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 2. 登录框样式 */
        .login-box {
            width: 350px;
            padding: 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;  /* 内部元素纵向排列 */
            gap: 20px;               /* 元素之间的间距 */
        }

        h2 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #333;
        }

        /* 3. 输入框排版 */
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* 防止边框撑破宽度 */
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
        }

        /* 4. 按钮样式 */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .links {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .links a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>NanoBlog 登录</h2>

    <input type="text" id="username" placeholder="请输入用户名">
    <input type="password" id="password" placeholder="请输入密码">

    <button id="loginBtn">登 录</button>

    <div class="links">
        还没有账号？ <a href="register.html">去注册</a>
    </div>
</div>

<script>
    document.getElementById("loginBtn").onclick = function() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;

        if (!username || !password) {
            alert("用户名和密码不能为空！");
            return;
        }

        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var res = JSON.parse(xhr.responseText);
                if (res.code === 200) {
                    alert("登录成功！");
                    localStorage.getItem("loginUsername",username);
                    // 登录成功跳转
                    window.location.href = "/NanoBlog_war/pages/front/index.html";
                } else {
                    alert(res.msg);
                }
            }
        };

        xhr.open("POST", "/NanoBlog_war/user/doLogin", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.send("username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password));
    };
</script>

</body>
</html>
