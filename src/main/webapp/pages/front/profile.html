<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人资料 - NanoBlog</title>
    <link rel="stylesheet" href="../../static/css/common/common.css">
    <link rel="stylesheet" href="../../static/css/common/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ======================================================
           profile.css — NanoBlog 个人主页专属样式
           依赖 auth.css 中的 :root CSS 变量
           ====================================================== */

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: var(--body-bg);
            background-image:
                    radial-gradient(ellipse at 15% 20%, rgba(163,216,224,0.2) 0%, transparent 55%),
                    radial-gradient(ellipse at 85% 80%, rgba(61,115,152,0.08) 0%, transparent 55%);
            color: var(--text-main);
            padding: 32px 16px 64px;
        }

        /* ── 页面主容器 ── */
        .profile-page {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ── 卡片通用 ── */
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(61,115,152,0.10);
            overflow: hidden;
            animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        .card:nth-child(2) { animation-delay: 0.07s; }
        .card:nth-child(3) { animation-delay: 0.14s; }
        .card:nth-child(4) { animation-delay: 0.21s; }
        .card:nth-child(5) { animation-delay: 0.28s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 24px 14px;
            border-bottom: 1px solid #f0f4f8;
        }
        .card-header i {
            color: var(--brand-blue);
            font-size: 1rem;
        }
        .card-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        /* ═══════════════════════════════════
           [1] 头像 & 基本信息卡片
           ═══════════════════════════════════ */
        .profile-hero {
            position: relative;
        }

        .hero-bg {
            height: 110px;
            background: linear-gradient(135deg, #2d5f7c 0%, var(--brand-blue) 50%, #4a8ba8 100%);
            position: relative;
            overflow: hidden;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(163,216,224,0.25) 0%, transparent 65%);
            border-radius: 50%;
        }
        .hero-bg::after {
            content: '';
            position: absolute;
            bottom: -30px; left: 30%;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 65%);
            border-radius: 50%;
        }

        .hero-body {
            padding: 0 28px 24px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-top: -48px;
            position: relative;
        }

        /* 头像 */
        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .avatar-wrapper img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 16px rgba(61,115,152,0.2);
            display: block;
        }
        .avatar-mask {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(61,115,152,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.25s;
            color: #fff;
            font-size: 1.1rem;
        }
        .avatar-wrapper:hover .avatar-mask { opacity: 1; }
        .avatar-mask input { display: none; }

        /* 用户名区 */
        .hero-info {
            flex: 1;
            padding-bottom: 4px;
            padding-top: 52px;
        }
        .hero-info h2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }
        .hero-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .username-tag {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .status-ok    { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }

        /* 操作按钮区 */
        .hero-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            padding-top: 52px;
            flex-shrink: 0;
        }

        /* ── 通用按钮 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.25s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4a89a8, var(--brand-blue));
            color: #fff;
            box-shadow: 0 4px 12px rgba(61,115,152,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(61,115,152,0.32); }
        .btn-secondary {
            background: #f0f5f8;
            color: var(--text-muted);
            border: 1.5px solid #e2eaf0;
        }
        .btn-secondary:hover { background: #e4edf5; color: var(--brand-blue); border-color: var(--brand-mint); }
        .btn-ghost {
            background: transparent;
            color: var(--brand-blue);
            border: 1.5px solid rgba(61,115,152,0.25);
        }
        .btn-ghost:hover { background: var(--brand-mint-light); border-color: var(--brand-mint); }
        .btn-danger-ghost {
            background: transparent;
            color: #dc2626;
            border: 1.5px solid rgba(220,38,38,0.2);
        }
        .btn-danger-ghost:hover { background: #fef2f2; border-color: #fca5a5; }

        /* ═══════════════════════════════════
           [2] 统计数据栏
           ═══════════════════════════════════ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
        }
        .stat-item {
            padding: 20px;
            text-align: center;
            position: relative;
            transition: background 0.2s;
        }
        .stat-item:hover { background: #fafcff; }
        .stat-item + .stat-item::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 1px;
            background: #edf2f7;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--brand-blue);
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }
        .stat-icon {
            display: inline-block;
            width: 32px; height: 32px;
            border-radius: 8px;
            background: var(--brand-mint-light);
            color: var(--brand-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 0.85rem;
        }

        /* ═══════════════════════════════════
           [3] 信息面板（查看 & 编辑）
           ═══════════════════════════════════ */
        .info-panel { padding: 20px 24px 24px; }

        /* 查看模式 */
        .user-main-info { margin-bottom: 20px; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 24px;
            margin-bottom: 20px;
        }
        .info-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-item p,
        .info-item .readonly-input {
            font-size: 0.9rem;
            color: var(--text-main);
        }
        .readonly-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-family: inherit;
            padding: 0;
            color: var(--text-muted);
        }
        .role-text { font-weight: 600; }

        .bio-section label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .bio-section p {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #4a5568;
            background: #f8fbfd;
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #edf2f7;
        }

        /* 编辑模式 */
        .edit-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e6edf3;
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--text-main);
            background: #f6f9fc;
            transition: all 0.25s;
            outline: none;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--brand-mint);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(163,216,224,0.18);
        }
        .form-group textarea { min-height: 90px; }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        /* ═══════════════════════════════════
           [4] 我的文章
           ═══════════════════════════════════ */
        .articles-body { padding: 0 24px 20px; }

        .article-list { display: flex; flex-direction: column; gap: 0; }

        .article-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f4f8;
            transition: background 0.2s;
            border-radius: 8px;
            cursor: pointer;
        }
        .article-item:last-child { border-bottom: none; }
        .article-item:hover { background: #f8fbff; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }

        .article-thumb {
            width: 62px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--brand-mint-light), rgba(61,115,152,0.08));
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-blue);
            font-size: 1.2rem;
            overflow: hidden;
        }
        .article-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .article-info { flex: 1; min-width: 0; }
        .article-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article-meta {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .article-meta span { display: flex; align-items: center; gap: 4px; }

        .article-status {
            padding: 2px 9px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .status-published { background: #d1fae5; color: #065f46; }
        .status-draft     { background: #fef9c3; color: #713f12; }

        .articles-empty {
            padding: 36px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .articles-empty i { font-size: 2rem; opacity: 0.3; display: block; margin-bottom: 10px; }

        .articles-footer {
            padding: 14px 24px 18px;
            border-top: 1px solid #f0f4f8;
            display: flex;
            justify-content: center;
        }

        /* ═══════════════════════════════════
           [5] 危险区 / 注销账号
           ═══════════════════════════════════ */
        .danger-zone-body {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .danger-info h4 { font-size: 0.9rem; font-weight: 700; color: #dc2626; }
        .danger-info p  { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
        .card-header.danger-header i { color: #dc2626; }
        .card-header.danger-header h3 { color: #dc2626; }

        /* ═══════════════════════════════════
           [6] 修改密码弹窗 Modal
           ═══════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,25,40,0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #fff;
            border-radius: 20px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 32px 80px rgba(61,115,152,0.2);
            transform: translateY(20px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
            opacity: 0;
            overflow: hidden;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 16px;
            border-bottom: 1px solid #f0f4f8;
        }
        .modal-header-left { display: flex; align-items: center; gap: 10px; }
        .modal-header-left i { color: var(--brand-blue); }
        .modal-header-left h3 { font-size: 1rem; font-weight: 700; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: none;
            background: #f0f4f8;
            color: var(--text-muted);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .modal-close:hover { background: #fee2e2; color: #dc2626; }

        .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }

        .modal-field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .modal-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: #f6f9fc;
            border: 1.5px solid #e6edf3;
            border-radius: 10px;
            transition: all 0.25s;
            overflow: hidden;
        }
        .modal-field-wrap:focus-within {
            border-color: var(--brand-mint);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(163,216,224,0.18);
        }
        .modal-field-wrap input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--text-main);
            padding: 0 14px;
        }
        .modal-field-wrap .eye-btn {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border: none; background: none; cursor: pointer;
            color: #b0bec5; margin-right: 2px;
            border-radius: 7px; transition: all 0.2s;
        }
        .modal-field-wrap .eye-btn:hover { color: var(--brand-blue); background: var(--brand-mint-light); }

        .pwd-strength { margin-top: 6px; display: flex; align-items: center; gap: 5px; }
        .pwd-bar { flex:1; height:3px; border-radius:2px; background:#e6edf3; transition:background 0.3s; }
        .pwd-bar.weak   { background:#f87171; }
        .pwd-bar.fair   { background:#fb923c; }
        .pwd-bar.good   { background:#34d399; }
        .pwd-bar.strong { background: var(--brand-blue); }
        .pwd-strength-label { font-size:0.72rem; color: var(--text-muted); width:28px; text-align:right; }

        .modal-footer {
            padding: 14px 24px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #f0f4f8;
        }

        /* ── 注销确认弹窗 ── */
        .confirm-modal .modal-box { width: 380px; }
        .confirm-body { padding: 24px; text-align: center; }
        .confirm-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: #fef2f2;
            color: #dc2626;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            margin: 0 auto 14px;
        }
        .confirm-body h4 { font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .confirm-body p  { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
        .confirm-footer {
            padding: 0 24px 22px;
            display: flex; gap: 10px;
        }
        .confirm-footer .btn { flex: 1; justify-content: center; }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(220,38,38,0.25);
        }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(220,38,38,0.35); }

        /* ── 提示 Toast ── */
        .toast {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 2000;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(-8px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #fff; border-left: 4px solid #10b981; color: #065f46; }
        .toast.error   { background: #fff; border-left: 4px solid #ef4444; color: #991b1b; }
        .toast.info    { background: #fff; border-left: 4px solid var(--brand-blue); color: var(--brand-blue); }

        /* ── 响应式 ── */
        @media (max-width: 600px) {
            .hero-body { flex-wrap: wrap; }
            .hero-actions { padding-top: 0; width: 100%; }
            .info-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(3,1fr); }
            .danger-zone-body { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="profile-page">

    <!-- ① 头像 & 基本信息卡片 -->
    <div class="card profile-hero">
        <div class="hero-bg"></div>
        <div class="hero-body">
            <div class="avatar-wrapper">
                <img id="avatarDisplay" src="../../static/images/avatar-default.png" alt="头像">
                <label class="avatar-mask" for="avatarInput">
                    <i class="fas fa-camera"></i>
                    <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(this)">
                </label>
            </div>
            <div class="hero-info">
                <h2 id="nicknameDisplay">加载中...</h2>
                <div class="hero-meta">
                    <span id="usernameDisplay" class="username-tag">@loading</span>
                    <span id="statusBadge" class="status-badge">---</span>
                </div>
            </div>
            <div class="hero-actions">
                <button id="editBtn" class="btn btn-ghost" onclick="enableEdit()">
                    <i class="fas fa-pen"></i> 编辑资料
                </button>
                <button class="btn btn-ghost" onclick="openChangePassword()">
                    <i class="fas fa-key"></i> 修改密码
                </button>
            </div>
        </div>
    </div>

    <!-- ② 统计数据栏（接口预留） -->
    <!--
        TODO（队友对接）：
        GET /user/getStats
        响应: { code: 200, data: { followCount: 12, viewCount: 3421, likeCount: 87 } }
    -->
    <div class="card">
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-icon"><i class="fas fa-user-friends"></i></div>
                <div class="stat-value" id="statFollow">--</div>
                <div class="stat-label">我的关注</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon"><i class="fas fa-eye"></i></div>
                <div class="stat-value" id="statView">--</div>
                <div class="stat-label">总浏览量</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon"><i class="fas fa-thumbs-up"></i></div>
                <div class="stat-value" id="statLike">--</div>
                <div class="stat-label">总获赞</div>
            </div>
        </div>
    </div>

    <!-- ③ 详细信息（查看 / 编辑，原始逻辑保留） -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-id-card"></i>
            <h3>账号详情</h3>
        </div>

        <!-- 查看面板 -->
        <div id="viewPanel" class="info-panel">
            <div class="info-grid">
                <div class="info-item">
                    <label>用户ID</label>
                    <input type="text" id="userId" readonly class="readonly-input">
                </div>
                <div class="info-item">
                    <label>电子邮箱</label>
                    <p id="emailDisplay">---</p>
                </div>
                <div class="info-item">
                    <label>用户角色</label>
                    <p id="roleDisplay" class="role-text">---</p>
                </div>
                <div class="info-item">
                    <label>注册时间</label>
                    <p id="createTimeDisplay">---</p>
                </div>
                <div class="info-item">
                    <label>最后登录</label>
                    <p id="lastLoginDisplay">---</p>
                </div>
                <div class="info-item">
                    <label>更新时间</label>
                    <p id="updateTimeDisplay">---</p>
                </div>
            </div>
            <div class="bio-section">
                <label>个人简介</label>
                <p id="bioDisplay">加载中...</p>
            </div>
        </div>

        <!-- 编辑面板 -->
        <div id="editPanel" class="info-panel" style="display:none;">
            <div class="edit-form">
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="nicknameInput" placeholder="起个好听的名字吧">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="emailInput" placeholder="yourname@example.com">
                </div>
                <div class="form-group">
                    <label>个人简介</label>
                    <textarea id="bioInput" rows="4" placeholder="介绍一下你自己..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="cancelEdit()">取消</button>
                    <button class="btn btn-primary" onclick="submitUpdate()">
                        <i class="fas fa-check"></i> 保存修改
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ④ 我的文章（接口预留） -->
    <!--
        TODO（队友对接）：
        GET /article/getMyArticles?page=1&size=5
        响应: {
          code: 200,
          data: {
            list: [
              { id, title, coverUrl, viewCount, likeCount, status, createTime }
            ],
            total: 18
          }
        }
    -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-newspaper"></i>
            <h3>我的文章</h3>
        </div>
        <div class="articles-body">
            <div id="articleList" class="article-list">
                <!-- 初始占位，由 loadMyArticles() 填充 -->
                <div class="articles-empty">
                    <i class="fas fa-file-alt"></i>
                    <span>暂无文章，快去创作吧~</span>
                </div>
            </div>
        </div>
        <div class="articles-footer">
            <button class="btn btn-ghost" onclick="goToMyArticles()">
                <i class="fas fa-list"></i> 查看全部文章
            </button>
        </div>
    </div>

    <!-- ⑤ 危险区 / 注销账号（接口预留） -->
    <!--
        TODO（队友对接）：
        POST /user/deleteAccount
        Body: { password: "..." }
        响应: { code: 200 } → 前端清 session，跳转登录页
    -->
    <div class="card">
        <div class="card-header danger-header">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>危险区域</h3>
        </div>
        <div class="danger-zone-body">
            <div class="danger-info">
                <h4>注销账号</h4>
                <p>此操作不可逆，账号下所有数据将被永久删除。</p>
            </div>
            <button class="btn btn-danger-ghost" onclick="openDeleteConfirm()">
                <i class="fas fa-user-times"></i> 注销账号
            </button>
        </div>
    </div>

</div><!-- /profile-page -->


<!-- ══════════════════════════════════════
     修改密码 Modal
     ══════════════════════════════════════ -->
<div id="pwdModal" class="modal-overlay" onclick="handleOverlayClick(event, 'pwdModal')">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-header-left">
                <i class="fas fa-key"></i>
                <h3>修改密码</h3>
            </div>
            <button class="modal-close" onclick="closeChangePassword()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>当前密码</label>
                <div class="modal-field-wrap">
                    <input type="password" id="oldPassword" placeholder="请输入当前密码">
                    <button class="eye-btn" type="button" onclick="toggleEye('oldPassword', this)">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>
            <div class="modal-field">
                <label>新密码</label>
                <div class="modal-field-wrap">
                    <input type="password" id="newPassword" placeholder="至少 6 位，含字母和数字" oninput="checkPwdStrength(this.value)">
                    <button class="eye-btn" type="button" onclick="toggleEye('newPassword', this)">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <div class="pwd-strength">
                    <div class="pwd-bar" id="pBar1"></div>
                    <div class="pwd-bar" id="pBar2"></div>
                    <div class="pwd-bar" id="pBar3"></div>
                    <div class="pwd-bar" id="pBar4"></div>
                    <span class="pwd-strength-label" id="pLabel"></span>
                </div>
            </div>
            <div class="modal-field">
                <label>确认新密码</label>
                <div class="modal-field-wrap">
                    <input type="password" id="confirmPassword" placeholder="再次输入新密码">
                    <button class="eye-btn" type="button" onclick="toggleEye('confirmPassword', this)">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeChangePassword()">取消</button>
            <button class="btn btn-primary" onclick="submitChangePassword()">
                <i class="fas fa-save"></i> 确认修改
            </button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════
     注销确认 Modal
     ══════════════════════════════════════ -->
<div id="deleteModal" class="modal-overlay confirm-modal" onclick="handleOverlayClick(event, 'deleteModal')">
    <div class="modal-box">
        <div class="confirm-body">
            <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
            <h4>确认注销账号？</h4>
            <p>你的所有文章、评论、关注数据将被<strong>永久删除</strong>，无法找回。请输入密码确认此操作。</p>
            <div class="modal-field" style="margin-top:16px; text-align:left;">
                <label style="font-size:0.72rem;font-weight:700;color:#dc2626;letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:6px;">验证当前密码</label>
                <div class="modal-field-wrap">
                    <input type="password" id="deleteConfirmPassword" placeholder="输入密码以确认">
                </div>
            </div>
        </div>
        <div class="confirm-footer">
            <button class="btn btn-secondary" onclick="closeDeleteConfirm()">我再想想</button>
            <button class="btn btn-danger" onclick="submitDeleteAccount()">
                <i class="fas fa-trash-alt"></i> 确认注销
            </button>
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast"></div>


<script>
    /* ================================================================
       工具函数
    ================================================================ */
    function showToast(msg, type = 'info') {
        const t = document.getElementById('toast');
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
        t.innerHTML = `<i class="fas ${icons[type]}"></i> ${msg}`;
        t.className = `toast ${type} show`;
        setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function toggleEye(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye-slash';
        }
    }

    function handleOverlayClick(e, modalId) {
        if (e.target.id === modalId) {
            if (modalId === 'pwdModal') closeChangePassword();
            if (modalId === 'deleteModal') closeDeleteConfirm();
        }
    }

    /* ================================================================
       原有功能（未做任何修改）
    ================================================================ */

    window.onload = function () {
        fetchProfile();
        fetchStats();
        loadMyArticles();
    };

    /* 1. 获取并渲染资料 —— 原始逻辑 */
    function fetchProfile() {
        fetch('/user/getProfile')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    const u  = res.data.user;
                    const rId = res.data.roleId;

                    document.getElementById('userId').value           = u.id;
                    document.getElementById('nicknameDisplay').innerText = u.nickname || '未设置昵称';
                    document.getElementById('usernameDisplay').innerText = '@' + u.username;
                    document.getElementById('emailDisplay').innerText  = u.email || '未绑定';
                    document.getElementById('bioDisplay').innerText    = u.bio || '这个人很懒，暂时没有简介。';

                    document.getElementById('nicknameInput').value = u.nickname || '';
                    document.getElementById('emailInput').value    = u.email    || '';
                    document.getElementById('bioInput').value      = u.bio      || '';

                    const roleEl = document.getElementById('roleDisplay');
                    if (rId == 2) {
                        roleEl.innerText    = '管理员';
                        roleEl.style.color  = '#e53e3e';
                    } else {
                        roleEl.innerText    = '普通用户';
                        roleEl.style.color  = '#4a5568';
                    }

                    const formatTime = (t) => t ? t.replace('T', ' ').split('.')[0] : '---';
                    document.getElementById('createTimeDisplay').innerText  = formatTime(u.createTime);
                    document.getElementById('lastLoginDisplay').innerText   = formatTime(u.lastLoginTime);
                    document.getElementById('updateTimeDisplay').innerText  = formatTime(u.updateTime);

                    if (u.avatarUrl) document.getElementById('avatarDisplay').src = u.avatarUrl;

                    const badge = document.getElementById('statusBadge');
                    badge.innerText   = u.status === 1 ? '正常' : '已封禁';
                    badge.className   = u.status === 1 ? 'status-badge status-ok' : 'status-badge status-error';
                } else {
                    window.location.href = 'login.html';
                }
            })
            .catch(err => console.error('加载个人资料出错:', err));
    }

    /* 2. 开启编辑模式 —— 原始逻辑 */
    function enableEdit() {
        document.getElementById('viewPanel').style.display = 'none';
        document.getElementById('editPanel').style.display = 'block';
        document.getElementById('editBtn').style.display   = 'none';
    }

    /* 3. 取消编辑模式 —— 原始逻辑 */
    function cancelEdit() {
        document.getElementById('viewPanel').style.display = 'block';
        document.getElementById('editPanel').style.display = 'none';
        document.getElementById('editBtn').style.display   = 'flex';
    }

    /* 4. 提交更新请求 —— 原始逻辑（alert → showToast） */
    function submitUpdate() {
        const updateData = {
            id:        document.getElementById('userId').value,
            nickname:  document.getElementById('nicknameInput').value,
            email:     document.getElementById('emailInput').value,
            bio:       document.getElementById('bioInput').value,
            avatarUrl: document.getElementById('avatarDisplay').src
        };

        fetch('/user/updateProfile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updateData)
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    showToast('资料修改成功！', 'success');
                    setTimeout(() => location.reload(), 1200);
                } else {
                    showToast('更新失败：' + res.msg, 'error');
                }
            });
    }

    /* 5. 头像上传 —— 原始逻辑（alert → showToast） */
    function uploadAvatar(input) {
        if (!input.files || !input.files[0]) return;
        const formData = new FormData();
        formData.append('file', input.files[0]);

        fetch('/user/uploadAvatar', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    document.getElementById('avatarDisplay').src = res.data;
                    showToast('预览头像已更新，点击【保存修改】生效', 'info');
                } else {
                    showToast('上传失败：' + res.msg, 'error');
                }
            });
    }

    /* ================================================================
       新增功能
    ================================================================ */

    /* ── 统计数据（接口预留）──
       TODO（队友对接）：GET /user/getStats
       响应：{ code:200, data:{ followCount, viewCount, likeCount } }
    */
    function fetchStats() {
        fetch('/user/getStats')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    document.getElementById('statFollow').innerText = formatNumber(res.data.followCount);
                    document.getElementById('statView').innerText   = formatNumber(res.data.viewCount);
                    document.getElementById('statLike').innerText   = formatNumber(res.data.likeCount);
                }
            })
            .catch(() => { /* 接口未就绪时静默失败，保持 -- 占位 */ });
    }

    function formatNumber(n) {
        if (n === undefined || n === null) return '--';
        if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
        if (n >= 1000)  return (n / 1000).toFixed(1) + 'k';
        return n;
    }

    /* ── 我的文章（接口预留）──
       TODO（队友对接）：GET /article/getMyArticles?page=1&size=5
       响应：{ code:200, data:{ list:[{ id, title, coverUrl, viewCount, likeCount, status, createTime }], total } }
    */
    function loadMyArticles() {
        fetch('/article/getMyArticles?page=1&size=5')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200 && res.data.list && res.data.list.length > 0) {
                    renderArticleList(res.data.list);
                }
                // 若接口未就绪或无文章，保留默认空状态占位
            })
            .catch(() => { /* 接口未就绪时静默失败 */ });
    }

    function renderArticleList(list) {
        const container = document.getElementById('articleList');
        container.innerHTML = list.map(a => `
            <div class="article-item" onclick="goToArticle(${a.id})">
                <div class="article-thumb">
                    ${a.coverUrl
            ? `<img src="${a.coverUrl}" alt="${a.title}">`
            : '<i class="fas fa-file-alt"></i>'}
                </div>
                <div class="article-info">
                    <div class="article-title">${a.title}</div>
                    <div class="article-meta">
                        <span><i class="fas fa-eye"></i> ${formatNumber(a.viewCount)}</span>
                        <span><i class="fas fa-thumbs-up"></i> ${formatNumber(a.likeCount)}</span>
                        <span><i class="fas fa-clock"></i> ${formatArticleTime(a.createTime)}</span>
                    </div>
                </div>
                <span class="article-status ${a.status === 1 ? 'status-published' : 'status-draft'}">
                    ${a.status === 1 ? '已发布' : '草稿'}
                </span>
            </div>
        `).join('');
    }

    function formatArticleTime(t) {
        if (!t) return '---';
        return t.replace('T', ' ').split('.')[0].substring(0, 10);
    }

    /* TODO（队友对接）跳转文章详情 */
    function goToArticle(id) {
        window.location.href = `/pages/front/article.html?id=${id}`;
    }

    /* TODO（队友对接）跳转我的全部文章列表 */
    function goToMyArticles() {
        window.location.href = '/pages/front/my-articles.html';
    }

    /* ── 修改密码 Modal ── */
    function openChangePassword() {
        document.getElementById('oldPassword').value     = '';
        document.getElementById('newPassword').value     = '';
        document.getElementById('confirmPassword').value = '';
        resetPwdStrength();
        document.getElementById('pwdModal').classList.add('active');
    }

    function closeChangePassword() {
        document.getElementById('pwdModal').classList.remove('active');
    }

    /* TODO（队友对接）：POST /user/changePassword
       Body：{ oldPassword, newPassword }
       响应：{ code:200 } → 成功，{ code:400, msg:"原密码错误" } → 失败
    */
    function submitChangePassword() {
        const oldPwd  = document.getElementById('oldPassword').value.trim();
        const newPwd  = document.getElementById('newPassword').value.trim();
        const confPwd = document.getElementById('confirmPassword').value.trim();

        if (!oldPwd || !newPwd || !confPwd) {
            showToast('请填写所有密码字段', 'error'); return;
        }
        if (newPwd !== confPwd) {
            showToast('两次输入的新密码不一致', 'error'); return;
        }
        if (newPwd.length < 6) {
            showToast('新密码长度不能少于 6 位', 'error'); return;
        }

        //发送请求
        fetch('/user/updatePassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    showToast('密码修改成功，请重新登录', 'success');
                    closeChangePassword();
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    showToast(res.msg || '修改失败', 'error');
                }
            })
            .catch(() => showToast('网络异常，请稍后再试', 'error'));
    }

    /* 密码强度检测 */
    function checkPwdStrength(val) {
        const bars  = [1,2,3,4].map(i => document.getElementById('pBar' + i));
        const label = document.getElementById('pLabel');
        bars.forEach(b => b.className = 'pwd-bar');

        if (!val) { label.innerText = ''; return; }

        let score = 0;
        if (val.length >= 8)  score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = ['', 'weak', 'fair', 'good', 'strong'];
        const names  = ['', '弱', '中', '良', '强'];
        for (let i = 0; i < score; i++) bars[i].classList.add(levels[score]);
        label.innerText = names[score] || '';
    }

    function resetPwdStrength() {
        [1,2,3,4].forEach(i => document.getElementById('pBar' + i).className = 'pwd-bar');
        document.getElementById('pLabel').innerText = '';
    }

    /* ── 注销账号 Modal ── */
    function openDeleteConfirm() {
        document.getElementById('deleteConfirmPassword').value = '';
        document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteConfirm() {
        document.getElementById('deleteModal').classList.remove('active');
    }

    /* TODO（队友对接）：POST /user/deleteAccount
       Body：{ password }
       响应：{ code:200 } → 清 session 后跳转登录页
    */
    function submitDeleteAccount() {
        const pwd = document.getElementById('deleteConfirmPassword').value.trim();
        if (!pwd) { showToast('请输入密码以确认操作', 'error'); return; }

        fetch('/user/deleteAccount', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    showToast('账号已注销，再见…', 'info');
                    setTimeout(() => window.location.href = 'login.html', 1800);
                } else {
                    showToast(res.msg || '注销失败，密码可能有误', 'error');
                }
            })
            .catch(() => showToast('网络异常，请稍后再试', 'error'));
    }
</script>
