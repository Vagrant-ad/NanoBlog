<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 - NanoBlog</title>

  <link rel="icon" href="/favicon.ico">

  <!-- 引入 Layui 样式 -->
  <link rel="stylesheet" href="/static/lib/layui/css/layui.css">

  <!-- 引入 EasyMDE 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">

  <!-- 引入通用样式与专属样式 -->
  <link rel="stylesheet" href="../../static/css/common/common.css">
  <link rel="stylesheet" href="../../static/css/front/editor.css">
</head>
<body class="editor-page">

<header class="navbar">
  <div class="navbar-inner">
    <!-- 左侧：Logo + 导航 -->
    <div class="navbar-left">
      <a class="logo-link" href="/pages/front/index.html">
        <img src="/static/images/logo-horizontal.png" alt="NanoBlog Logo" class="logo-image">
        <span class="sr-only">NanoBlog</span>
      </a>
      <nav class="navbar-menu">
        <a href="/pages/front/index.html">首页</a>
        <a href="#">分类</a>
        <a href="#">标签</a>
      </nav>
    </div>

    <!-- 中间：搜索框 -->
    <div class="navbar-center">
      <div class="search-box">
        <i class="layui-icon layui-icon-search" id="searchBtn"></i>
        <input type="text" placeholder="搜索文章标题、标签、作者" id="searchInput">
      </div>
    </div>


    <!-- 右侧：用户操作区 -->
    <div class="navbar-right">
      <!-- 在 editor.html 加上 active 类 -->
      <a href="/pages/front/editor.html" class="nav-button active">写文章</a>
      <!--<a href="/pages/front/login.html" class="nav-link">登录</a>
      <a href="/pages/front/register.html" class="nav-button">注册</a>-->
      <!--用户区域由js根据登录状态动态渲染-->
      <div id="navUserArea"></div>
    </div>
  </div>
</header>

<!-- 写作主容器 -->
<main class="editor-container">
  <form class="layui-form publish-form" lay-filter="publishForm">

    <!-- 头部：标题与发布按钮 -->
    <div class="editor-header-actions">
      <div class="title-input-wrapper">
        <input type="text" name="articleTitle" required lay-verify="required"
               placeholder="请输入文章标题..." autocomplete="off" class="editor-title-input">
      </div>
      <div class="action-buttons">
        <button type="button" class="layui-btn layui-btn-primary btn-draft">存为草稿</button>
        <button type="button" class="layui-btn btn-publish" lay-submit lay-filter="publishBtn">发布文章</button>
      </div>
    </div>

    <!-- 元数据设置区 -->
    <div class="editor-meta-card">
      <div class="layui-row layui-col-space20">

        <!-- 左侧：分类与标签 -->
        <div class="layui-col-md6">
          <div class="meta-item">
            <label class="meta-label">文章分类</label>
            <div class="meta-control">
              <select name="categoryId" id="categorySelect" lay-verify="required">
                <option value="">点击选择分类</option>
              </select>
            </div>
          </div>

          <div class="meta-item">
            <label class="meta-label">文章标签 (Enter添加)</label>
            <div class="tags-input-container">
              <div id="tagList" class="tag-list"></div>
              <input type="text" id="tagInput" class="tag-input" placeholder="输入标签名...">
            </div>
          </div>
        </div>

        <!-- 右侧：封面图 -->
        <div class="layui-col-md6">
          <div class="meta-item">
            <label class="meta-label">文章封面</label>
            <div class="cover-uploader" id="coverUploadBtn">
              <div class="uploader-content" id="uploaderContent">
                <i class="layui-icon layui-icon-picture" style="font-size: 32px; color: var(--brand-mint);"></i>
                <p>上传封面图</p>
              </div>
              <img id="coverPreview" src="" alt="预览" style="display: none;">
              <input type="hidden" name="coverUrl" id="coverUrlInput">
            </div>
          </div>
        </div>

        <!-- 摘要 -->
        <div class="layui-col-md12">
          <div class="meta-item">
            <label class="meta-label">文章摘要</label>
            <div class="meta-control">
                                <textarea name="articleSummary" placeholder="简短描述文章核心内容..."
                                          class="layui-textarea custom-textarea" rows="2"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 正文：编辑器 -->
    <div class="editor-content-card">
      <textarea name="contentMd" id="markdown-editor"></textarea>
    </div>

  </form>
</main>

<!-- JS 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script src="/static/lib/layui/layui.js"></script>
<script src="/static/js/front/editor.js"></script>
<script src="/static/js/common/common.js"></script>
</body>
</html>
