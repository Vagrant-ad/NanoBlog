<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - NanoBlog</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/static/lib/layui/css/layui.css">
    <link rel="stylesheet" href="/static/css/front/auth.css">
</head>
<body class="auth-body">

<canvas id="particleCanvas"></canvas>
<div class="geo-shape geo-circle-large" style="top:-80px;right:-80px;left:auto"></div>
<div class="geo-shape geo-circle-small" style="bottom:60px;left:60px;right:auto"></div>
<div class="geo-shape geo-ring" style="top:auto;bottom:-80px;left:30%"></div>

<div class="auth-wrapper auth-wrapper--register">
    <!-- 左侧表单区 -->
    <div class="auth-panel auth-panel--form">
        <div class="form-container">
            <div class="form-head">
                <div class="form-head__badge">REGISTER</div>
                <h2 class="form-head__title">创建账号</h2>
                <p class="form-head__sub">已有账号？<a href="login.html" class="link-accent">返回登录 →</a></p>
            </div>

            <div class="fields-row">
                <div class="field-group">
                    <label class="field-label">用户名</label>
                    <div class="field-wrap">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="username" class="field-input" placeholder="设置登录用户名">
                        <span class="field-line"></span>
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label">昵称</label>
                    <div class="field-wrap">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </span>
                        <input type="text" id="nickname" class="field-input" placeholder="你的显示昵称">
                        <span class="field-line"></span>
                    </div>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">密码</label>
                <div class="field-wrap">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="passwordHash" class="field-input" placeholder="设置密码（至少6位）">
                    <button type="button" class="field-eye" id="togglePwd">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    <span class="field-line"></span>
                </div>
                <div class="password-strength">
                    <span class="strength-bar" id="s1"></span>
                    <span class="strength-bar" id="s2"></span>
                    <span class="strength-bar" id="s3"></span>
                    <span class="strength-bar" id="s4"></span>
                    <span class="strength-label" id="sLabel"></span>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">邮箱地址</label>
                <div class="field-wrap">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </span>
                    <input type="text" id="email" class="field-input" placeholder="请输入邮箱地址">
                    <span class="field-line"></span>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">注册角色</label>
                <div class="field-wrap">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </span>
                    <select id="roleId" class="field-input" style="appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer;">
                        <option value="1" style="color: #333;">普通用户 (USER)</option>
                        <option value="2" style="color: #333;">管理员 (ADMIN)</option>
                    </select>
                    <span class="field-line"></span>
                </div>
            </div>


            <div class="field-group">
                <label class="field-label">验证码</label>
                <div class="captcha-wrap" style="display: flex; align-items: stretch; gap: 12px;">
                    <div class="field-wrap" style="flex: 1; margin-bottom: 0;">
            <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
                        <input type="text" id="emailCode" class="field-input" placeholder="请输入验证码" maxlength="4">
                        <span class="field-line"></span>
                    </div>

                    <img src="/user/captcha"
                         id="captchaImg"
                         alt="验证码"
                         title="点击更换验证码"
                         onclick="this.src='/user/captcha?t=' + new Date().getTime()"
                         class="captcha-img">
                </div>
            </div>

            <button id="regBtn" class="btn-submit">
                <span class="btn-submit__text">立即注册</span>
                <span class="btn-submit__arrow">→</span>
            </button>


        </div>
    </div>

    <!-- 右侧品牌区 -->
    <div class="auth-panel auth-panel--brand">
        <div class="brand-content">
            <a href="index.html" class="brand-logo-link">
                <img src="/static/images/logo-horizontal.png" alt="NanoBlog" class="brand-logo">
            </a>
            <div class="brand-headline">
                <h1 class="brand-title">加入我们</h1>
                <p class="brand-subtitle">开启你的专属数字空间<br>分享见解，结识同频的灵魂</p>
            </div>
            <div class="brand-features">
                <div class="feature-item"><span class="feature-icon">✦</span><span>Markdown 富文本写作</span></div>
                <div class="feature-item"><span class="feature-icon">✦</span><span>一键发布，全球可见</span></div>
                <div class="feature-item"><span class="feature-icon">✦</span><span>智能分类与标签管理</span></div>
            </div>
            <div class="brand-decor">
                <div class="decor-dot decor-dot--1"></div>
                <div class="decor-dot decor-dot--2"></div>
                <div class="decor-dot decor-dot--3"></div>
                <div class="decor-rings"><span></span><span></span><span></span></div>
            </div>
        </div>
        <div class="brand-footer-text">探索 · 创作 · 分享</div>
    </div>
</div>

<script src="/static/lib/layui/layui.js"></script>
<script>
    // 粒子背景
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 3 + 1,
                dx: (Math.random() - 0.5) * 0.4,
                dy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.4 + 0.1
            });
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(163, 216, 224, ${p.alpha})`;
                ctx.fill();
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();

    // 密码显示切换
    document.getElementById('togglePwd').addEventListener('click', function() {
        const pwd = document.getElementById('passwordHash');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        this.classList.toggle('active');
    });

    // 密码强度检测
    document.getElementById('passwordHash').addEventListener('input', function() {
        const val = this.value;
        const bars = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
        const label = document.getElementById('sLabel');
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const cls = ['', 'weak', 'fair', 'good', 'strong'];
        const lbs = ['', '弱', '一般', '较强', '强'];
        bars.forEach((b, i) => { b.className = 'strength-bar' + (i < score ? ' ' + cls[score] : ''); });
        label.textContent = val ? (lbs[score] || '强') : '';
    });

    // 字段聚焦动效
    document.querySelectorAll('.field-input').forEach(input => {
        input.addEventListener('focus', () => input.closest('.field-wrap').classList.add('focused'));
        input.addEventListener('blur', () => {
            input.closest('.field-wrap').classList.remove('focused');
            input.value
                ? input.closest('.field-wrap').classList.add('has-value')
                : input.closest('.field-wrap').classList.remove('has-value');
        });
    });

    // ===== 以下为原有核心逻辑，不做任何修改 =====
    $("#regBtn").click(function() {
        var username = $("#username").val();
        var password = $("#passwordHash").val();
        var nickname = $("#nickname").val();
        var email = $("#email").val();
        var emailCode = $("#emailCode").val();
        var roleId = $("#roleId").val();

        if (!username || !password || !nickname || !email) {
            layer.msg("请完整填写注册信息！", {icon: 7});
            return;
        }
        if (!emailCode) {
            layer.msg("请输入邮箱验证码！", {icon: 7});
            return;
        }

        $.ajax({
            url: "/user/doRegister",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                username: username,
                password: password,
                nickname: nickname,
                email: email,
                roleId: roleId
            }),
            success: function(res) {
                if (res.code === 200) {
                    layer.msg("注册成功！即将跳转登录", {icon: 1, time: 1500}, function(){
                        window.location.href = "login.html";
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            },
            error: function() {
                layer.msg("网络请求失败，请稍后再试", {icon: 2});
                // 4. 加一行打印日志，如果还报错，我们可以直接看控制台的原因

                layer.msg("网络请求失败，请稍后再试", {icon: 2});
                $(this).text("注 册").removeClass("loading");
            }
        });
    });
</script>
</body>
</html>
