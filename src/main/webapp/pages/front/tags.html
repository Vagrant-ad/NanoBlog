<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 - NanoBlog</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="../../static/lib/layui/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../static/css/common/common.css">
    <link rel="stylesheet" href="../../static/css/front/tags.css">
</head>
<body class="tags-page">

<!--导航栏-->
<header class="navbar">
    <div class="navbar-inner">
        <!--左侧：Logo + 导航-->
        <div class="navbar-left">
            <a class="logo-link" href="/pages/front/index.html">
                <img src="/static/images/logo-horizontal.png" alt="NanoBlog Logo" class="logo-image">
                <span class="sr-only">NanoBlog</span>
            </a>
            <nav class="navbar-menu">
                <a href="/pages/front/index.html">首页</a>
                <!--分类多级下拉-->
                <div class="nav-dropdown" id="categoryMenu">
                    <a href="#" class="nav-dropdown-trigger">
                        分类
                    </a>
                    <ul class="dropdown-menu" id="categoryDropdown"></ul>
                </div>


                <!--标签云下拉-->
                <div class="nav-dropdown" id="tagMenu">
                    <a href="/pages/front/tags.html" class="nav-dropdown-trigger active">
                        标签
                    </a>
                    <div class="dropdown-menu tag-cloud-menu" id="tagDropdown"></div>
                </div>
            </nav>
        </div>

        <!--中间：搜索框-->
        <div class="navbar-center">
            <div class="search-box">
                <i class="layui-icon layui-icon-search" id="searchBtn"></i>
                <input type="text" placeholder="搜索文章标题、标签、作者" id="searchInput">
            </div>
        </div>


        <!--右侧：用户操作区-->
        <div class="navbar-right">
            <!--在 editor.html 加上 active 类-->
            <a href="/pages/front/editor.html" class="nav-button">写文章</a>
            <!--<a href="/pages/front/login.html" class="nav-link">登录</a>
            <a href="/pages/front/register.html" class="nav-button">注册</a>-->
            <!--用户区域由js根据登录状态动态渲染-->
            <div id="navUserArea"></div>
        </div>
    </div>
</header>

<!--Hero-->
<section class="tags-hero">
    <div class="tags-hero-inner">
        <h1 class="tags-hero-title">所有<span>标签</span></h1>
        <p class="tags-hero-sub">浏览全部主题，发现感兴趣的内容</p>
        <div class="tags-hero-stats">
            <div class="stat-pill">
                <i class="fas fa-tags"></i>
                <span id="statTagCount">-- 个标签</span>
            </div>
            <div class="stat-pill">
                <i class="fas fa-file-alt"></i>
                <span id="statArticleSum">-- 篇文章</span>
            </div>
        </div>
    </div>
</section>

<!--工具栏:搜索+排序-->
<div class="tags-toolbar">
    <div class="tags-search-wrap">
        <i class="fas fa-search tags-search-icon"></i>
        <input
                type="text"
                class="tags-search-input"
                id="tagSearchInput"
                placeholder="输入标签名称，回车或点击搜索…"
                autocomplete="off"
        >
        <button class="tags-search-clear" id="tagSearchClear" title="清除">
            <i class="fas fa-times"></i>
        </button>
        <button class="tags-search-btn" id="tagSearchBtn">
            <i class="fas fa-search"></i> 搜索
        </button>
    </div>

    <div class="sort-group">
        <button class="sort-tag-btn active" data-sort="count">
            <i class="fas fa-fire"></i> 按热度
        </button>
        <button class="sort-tag-btn" data-sort="name">
            <i class="fas fa-sort-alpha-down"></i> 按名称
        </button>
    </div>
</div>

<!--结果提示-->
<div class="tags-result-info" id="tagsResultInfo"></div>

<!--标签云-->
<section class="tags-cloud-section">
    <div class="tags-cloud" id="tagsCloud">
        <!--骨架屏-->
        <div class="tag-skeleton" style="width:90px;  animation-delay:0s"></div>
        <div class="tag-skeleton" style="width:70px;  animation-delay:0.06s"></div>
        <div class="tag-skeleton" style="width:110px; animation-delay:0.12s"></div>
        <div class="tag-skeleton" style="width:80px;  animation-delay:0.18s"></div>
        <div class="tag-skeleton" style="width:60px;  animation-delay:0.24s"></div>
        <div class="tag-skeleton" style="width:100px; animation-delay:0.30s"></div>
        <div class="tag-skeleton" style="width:75px;  animation-delay:0.36s"></div>
        <div class="tag-skeleton" style="width:95px;  animation-delay:0.42s"></div>
    </div>
</section>

<footer class="page-footer">
    <p>© 2026 NanoBlog. All rights reserved.</p>
</footer>

<script src="/static/lib/layui/layui.js"></script>
<script src="/static/js/common/common.js"></script>
<script src="/static/js/front/tags.js"></script>
</body>
</html>
